<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Rhythm Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-wrapper">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="game-hud" aria-label="Game score">
        <div>Score <span id="score">0</span></div>
        <div><span id="combo">0 COMBO</span></div>
    </div>

    <main class="keyboard-container">
        <section id="game-area" aria-label="Rhythm game playfield">
            <div class="target-word" id="target-word" aria-label="Current target word"></div>
            <button type="button" class="start-button" id="start-button">Start Game</button>
            <div class="judgment-line" aria-hidden="true"></div>
            <div class="judgment-feedback" aria-live="polite" aria-atomic="true"></div>
        </section>
        <div class="keyboard">
            <div class="key-row">
                <div class="key" data-key="q">Q</div>
                <div class="key" data-key="w">W</div>
                <div class="key" data-key="e">E</div>
                <div class="key" data-key="r">R</div>
                <div class="key" data-key="t">T</div>
                <div class="key" data-key="y">Y</div>
                <div class="key" data-key="u">U</div>
                <div class="key" data-key="i">I</div>
                <div class="key" data-key="o">O</div>
                <div class="key" data-key="p">P</div>
            </div>
            <div class="key-row">
                <div class="key" data-key="a">A</div>
                <div class="key" data-key="s">S</div>
                <div class="key" data-key="d">D</div>
                <div class="key" data-key="f">F</div>
                <div class="key" data-key="g">G</div>
                <div class="key" data-key="h">H</div>
                <div class="key" data-key="j">J</div>
                <div class="key" data-key="k">K</div>
                <div class="key" data-key="l">L</div>
            </div>
            <div class="key-row">
                <div class="key" data-key="z">Z</div>
                <div class="key" data-key="x">X</div>
                <div class="key" data-key="c">C</div>
                <div class="key" data-key="v">V</div>
                <div class="key" data-key="b">B</div>
                <div class="key" data-key="n">N</div>
                <div class="key" data-key="m">M</div>
            </div>
        </div>
    </main>

    <div class="settings-panel">
        <span class="settings-label">GLOW COLOR</span>
        <div class="color-options">
            <button type="button" class="color-button" data-color="#00aaff" aria-label="Blue glow" title="Blue" style="background-color: #00aaff;"></button>
            <button type="button" class="color-button" data-color="#ff3333" aria-label="Red glow" title="Red" style="background-color: #ff3333;"></button>
            <button type="button" class="color-button" data-color="#ffcc00" aria-label="Yellow glow" title="Yellow" style="background-color: #ffcc00;"></button>
            <button type="button" class="color-button" data-color="#00ffff" aria-label="Cyan glow" title="Cyan" style="background-color: #00ffff;"></button>
            <button type="button" class="color-button" data-color="#aa00ff" aria-label="Purple glow" title="Purple" style="background-color: #aa00ff;"></button>
            <button type="button" class="color-button" data-color="#ff00aa" aria-label="Pink glow" title="Pink" style="background-color: #ff00aa;"></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
